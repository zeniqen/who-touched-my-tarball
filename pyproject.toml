[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whotouchedmytarball"
version = "0.1.0"
description = "Compare published npm and PyPI packages against their source repositories and flag suspicious differences."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "HardCarry" }]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
wtmt = "whotouchedmytarball.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["examples/offline-demo/source"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests hit npm, PyPI and GitHub. They are skipped by default (and in CI); run them with `pytest -m live`.
addopts = "-m 'not live'"
markers = ["live: needs network access to real registries (opt-in: pytest -m live)"]
